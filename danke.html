<head>

  <title>Danke – immbild.</title>
  <script>
/* Darstellung: tagsüber Papier, nachts Blaupause (nach der Sonne über Erftstadt), außer man hat selbst gewählt (gilt für diesen Besuch) */
(function(){var R=document.documentElement,S=null,mem=null;try{S=window.sessionStorage;S.getItem('look');}catch(e){S=null;}
function get(){var v=null;try{v=S?S.getItem('look'):mem;}catch(e){v=mem;}return(v==='papier'||v==='blaupause')?v:null;}
function set(v){mem=v;try{if(S)S.setItem('look',v);}catch(e){}}
function sun(d){d=d||new Date();var r=Math.PI/180,lat=50.83*r,lng=6.8,
n=Math.floor((Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())-Date.UTC(d.getUTCFullYear(),0,0))/864e5),g=2*Math.PI/365*(n-1),
eq=229.18*(0.000075+0.001868*Math.cos(g)-0.032077*Math.sin(g)-0.014615*Math.cos(2*g)-0.040849*Math.sin(2*g)),
dc=0.006918-0.399912*Math.cos(g)+0.070257*Math.sin(g)-0.006758*Math.cos(2*g)+0.000907*Math.sin(2*g)-0.002697*Math.cos(3*g)+0.00148*Math.sin(3*g),
ha=Math.acos(Math.cos(90.833*r)/(Math.cos(lat)*Math.cos(dc))-Math.tan(lat)*Math.tan(dc))/r,
noon=720-4*lng-eq,m=d.getUTCHours()*60+d.getUTCMinutes()+d.getUTCSeconds()/60;
return(m>=noon-4*ha&&m<noon+4*ha)?'papier':'blaupause';}
var q=new URLSearchParams(location.search).get('look');if(q==='nacht')q='blaupause';
if(q==='auto'){mem=null;try{if(S)S.removeItem('look');}catch(e){}}else if(q==='papier'||q==='blaupause')set(q);
window.immLook={sun:sun,manual:get,set:set};
R.dataset.look=get()||sun();})();
</script>

</head>
<body>
